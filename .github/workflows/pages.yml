name: Aperçu — Déploiement GitHub Pages

# Publie le site LKS ART en aperçu sur GitHub Pages, à chaque mise à jour
# de la branche de travail. URL : https://lystanguy-gif.github.io/bedrock-studio/

on:
  push:
    branches: ["claude/new-session-l4wuxi"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
